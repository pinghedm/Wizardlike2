spells:
  - id: test_wand
    name: Test Wand
    description: A basic attack that refills each floor.
    target: enemy
    radius: 0
    basic: true
    charges: 2
    effects:
      - type: damage
        power: 4
    momentum_damage_per_stack: 0.5
    mastery:
      casts_per_rank: 2
      max_rank: 3
      charge_bonus_per_rank: 1
      power_per_rank: 0.5
  - id: test_bolt
    name: Test Bolt
    description: A test bolt that zaps and slows its target.
    target: enemy
    radius: 0
    effects:
      - type: damage
        power: 12
      - type: slow
        duration: 40
    recipes:
      - ingredients: [reagent_a, reagent_b]
        charges: 3
    shop:
      price: 25
      charges: 4
    mastery:
      casts_per_rank: 2
      max_rank: 2
      charge_bonus_per_rank: 2
      power_per_rank: 0.25
  - id: test_blast
    name: Test Blast
    description: A test blast that damages a small area.
    target: enemy
    radius: 1
    effects:
      - type: damage
        power: 20
    momentum_damage_per_stack: 0.5
    recipes:
      - ingredients: [reagent_a, reagent_a]
        charges: 5
  - id: test_rare
    name: Test Rare
    description: A rare spell sold only at shops.
    rare: true
    target: enemy
    radius: 1
    effects:
      - type: damage
        power: 40
    recipes:
      - ingredients: [reagent_a, reagent_b, reagent_c]
        charges: 1
    shop:
      price: 50
      charges: 1
  - id: test_shove
    name: Test Shove
    description: A test spell that damages and knocks back its target.
    target: enemy
    radius: 0
    effects:
      - type: damage
        power: 5
      - type: knockback
        power: 2
    recipes:
      - ingredients: [reagent_a, reagent_c]
        charges: 3
  - id: test_soak
    name: Test Soak
    description: A test spell that leaves its target wet.
    target: enemy
    radius: 0
    effects:
      - type: wet
        duration: 40
    recipes:
      - ingredients: [reagent_b, reagent_b]
        charges: 3
  - id: test_zap
    name: Test Zap
    description: A test spell that hits wet targets twice as hard.
    target: enemy
    radius: 0
    effects:
      - type: damage
        power: 10
    modifiers:
      - vs_status: wet
        damage_mult: 2.0
    recipes:
      - ingredients: [reagent_c, reagent_c, reagent_c]
        charges: 3
  - id: test_quench
    name: Test Quench
    description: A test spell that wet targets shrug off.
    target: enemy
    radius: 0
    effects:
      - type: damage
        power: 10
    modifiers:
      - vs_status: wet
        damage_mult: 0.5
    recipes:
      - ingredients: [reagent_b, reagent_c]
        charges: 3
  - id: test_heal
    name: Test Heal
    description: A self-cast heal.
    target: self
    radius: 0
    effects:
      - type: heal
        power: 15
    recipes:
      - ingredients: [reagent_a, reagent_a, reagent_c]
        charges: 3
