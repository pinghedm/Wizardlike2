spells:
  - id: test_bolt
    name: Test Bolt
    description: A test bolt that zaps and slows its target.
    range: 8
    radius: 0
    effects:
      - type: damage
        power: 12
      - type: slow
        duration: 40
    recipes:
      - ingredients: [reagent_a, reagent_b]
        charges: 3
    shop:
      price: 25
      charges: 4
  - id: test_blast
    name: Test Blast
    description: A test blast that damages a small area.
    range: 6
    radius: 1
    effects:
      - type: damage
        power: 20
    recipes:
      - ingredients: [reagent_a, reagent_a]
        charges: 5
  - id: test_rare
    name: Test Rare
    description: A rare spell sold only at shops.
    rare: true
    range: 6
    radius: 1
    effects:
      - type: damage
        power: 40
    recipes:
      - ingredients: [reagent_a, reagent_b, reagent_c]
        charges: 1
    shop:
      price: 50
      charges: 1
  - id: test_shove
    name: Test Shove
    description: A test spell that damages and knocks back its target.
    range: 5
    radius: 0
    effects:
      - type: damage
        power: 5
      - type: knockback
        power: 2
    recipes:
      - ingredients: [reagent_a, reagent_c]
        charges: 3
