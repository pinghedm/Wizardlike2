[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    # "PL",  # pylint
]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.coverage.run]
source = ["src"]
# debug.py is a dev-only stderr logging shim gated on WIZARDLIKE_DEBUG; nothing to assert.
omit = ["src/**/__init__.py", "src/debug.py"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__", "venv"]
venvPath = "."
venv = "venv"
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingImports = true
reportMissingTypeStubs = false
