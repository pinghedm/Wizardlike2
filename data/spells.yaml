spells:
  - id: fireball
    name: Fireball
    description: A roaring ball of flame that bursts on impact.
    range: 6
    radius: 1
    effects:
      - type: damage
        power: 25
    recipes:
      - ingredients: [fire_crystal, fire_crystal]
        charges: 3
      - ingredients: [fire_crystal, fire_crystal, fire_crystal]
        charges: 7
  - id: ice_lance
    name: Ice Lance
    description: A spear of ice that pierces and chills its target.
    range: 8
    radius: 0
    effects:
      - type: damage
        power: 15
      - type: slow
        duration: 90
    recipes:
      - ingredients: [ice_shard, ice_shard]
        charges: 5
  - id: rejuvenation
    name: Rejuvenation
    description: Mends your wounds with a surge of restorative magic.
    range: 0
    radius: 0
    effects:
      - type: heal
        power: 30
    recipes:
      - ingredients: [mystic_herb, mystic_herb]
        charges: 2
  - id: steam_blast
    name: Steam Blast
    description: A scalding burst of steam that scorches a small area.
    range: 4
    radius: 1
    effects:
      - type: damage
        power: 15
    recipes:
      - ingredients: [fire_crystal, ice_shard]
        charges: 4
      - ingredients: [fire_crystal, ice_shard, mystic_herb]
        charges: 10
  - id: blight
    name: Blight
    description: A toxic hex that festers, poisoning the target over time.
    range: 8
    radius: 0
    effects:
      - type: damage
        power: 6
      - type: poison
        power: 4
        duration: 90
    recipes:
      - ingredients: [ice_shard, mystic_herb]
        charges: 4
  - id: renewal
    name: Renewal
    description: A lingering blessing that regenerates your health.
    range: 0
    radius: 0
    effects:
      - type: regen
        power: 5
        duration: 120
    recipes:
      - ingredients: [mystic_herb, mystic_herb, mystic_herb]
        charges: 3
  - id: quicken
    name: Quicken
    description: Hastens your movements, letting you act more often.
    range: 0
    radius: 0
    effects:
      - type: haste
        duration: 150
    recipes:
      - ingredients: [fire_crystal, mystic_herb]
        charges: 3
