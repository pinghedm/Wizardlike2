spells:
  - id: magic_missile
    name: Magic Missile
    description: An unerring dart of raw arcane force; a wizard starts each floor with a handful.
    target: enemy
    radius: 0
    basic: true
    charges: 6
    effects:
      - type: damage
        power: 6
    momentum_damage_per_stack: 0.08
    mastery:
      casts_per_rank: 4
      max_rank: 5
      charge_bonus_per_rank: 2
      power_per_rank: 0.1
  - id: fireball
    name: Fireball
    description: A roaring ball of flame that bursts on impact.
    target: enemy
    radius: 1
    effects:
      - type: damage
        power: 25
    modifiers:
      - vs_status: slow
        damage_mult: 1.5
      - vs_status: wet
        damage_mult: 0.5
    recipes:
      - ingredients: [fire_crystal, fire_crystal]
        charges: 3
      - ingredients: [fire_crystal, fire_crystal, fire_crystal]
        charges: 7
    shop:
      price: 40
      charges: 3
    momentum_damage_per_stack: 0.06
    mastery:
      casts_per_rank: 5
      max_rank: 5
      charge_bonus_per_rank: 1
      power_per_rank: 0.12
  - id: ice_lance
    name: Ice Lance
    description: A spear of ice that pierces and chills its target.
    target: enemy
    radius: 0
    effects:
      - type: damage
        power: 15
      - type: slow
        duration: 90
    recipes:
      - ingredients: [ice_shard, ice_shard]
        charges: 5
    momentum_damage_per_stack: 0.06
    mastery:
      casts_per_rank: 5
      max_rank: 5
      charge_bonus_per_rank: 1
      power_per_rank: 0.1
  - id: rejuvenation
    name: Rejuvenation
    description: Mends your wounds with a surge of restorative magic.
    target: self
    radius: 0
    effects:
      - type: heal
        power: 30
    recipes:
      - ingredients: [mystic_herb, mystic_herb]
        charges: 2
    shop:
      price: 30
      charges: 2
    mastery:
      casts_per_rank: 5
      max_rank: 5
      charge_bonus_per_rank: 1
      power_per_rank: 0.15
  - id: steam_blast
    name: Steam Blast
    description: A scalding burst of steam that scorches a small area.
    target: enemy
    radius: 1
    effects:
      - type: damage
        power: 15
    recipes:
      - ingredients: [fire_crystal, ice_shard]
        charges: 4
      - ingredients: [fire_crystal, ice_shard, mystic_herb]
        charges: 10
    mastery:
      casts_per_rank: 5
      max_rank: 5
      charge_bonus_per_rank: 1
      power_per_rank: 0.1
  - id: blight
    name: Blight
    description: A toxic hex that festers, poisoning the target over time.
    target: enemy
    radius: 0
    effects:
      - type: damage
        power: 6
      - type: poison
        power: 4
        duration: 90
    recipes:
      - ingredients: [ice_shard, mystic_herb]
        charges: 4
    mastery:
      casts_per_rank: 5
      max_rank: 5
      charge_bonus_per_rank: 1
      power_per_rank: 0.12
  - id: renewal
    name: Renewal
    description: A lingering blessing that regenerates your health.
    target: self
    radius: 0
    effects:
      - type: regen
        power: 5
        duration: 120
    recipes:
      - ingredients: [mystic_herb, mystic_herb, mystic_herb]
        charges: 3
    mastery:
      casts_per_rank: 5
      max_rank: 5
      charge_bonus_per_rank: 1
      power_per_rank: 0.15
  - id: quicken
    name: Quicken
    description: Hastens your movements, letting you act more often.
    target: self
    radius: 0
    effects:
      - type: haste
        duration: 150
    recipes:
      - ingredients: [fire_crystal, mystic_herb]
        charges: 3
    mastery:
      casts_per_rank: 5
      max_rank: 5
      charge_bonus_per_rank: 1
      power_per_rank: 0.0
  - id: meteor
    name: Meteor
    description: Calls down a devastating meteor, scorching a wide area.
    target: enemy
    rare: true
    radius: 2
    effects:
      - type: damage
        power: 50
    recipes:
      - ingredients: [fire_crystal, fire_crystal, ice_shard, mystic_herb]
        charges: 1
    shop:
      price: 120
      charges: 1
    mastery:
      casts_per_rank: 6
      max_rank: 3
      charge_bonus_per_rank: 1
      power_per_rank: 0.15
  - id: concussion
    name: Concussion
    description: A close blast that batters the target and hurls it backward.
    target: enemy
    radius: 0
    effects:
      - type: damage
        power: 12
      - type: knockback
        power: 2
    recipes:
      - ingredients: [fire_crystal, gale_feather]
        charges: 4
    mastery:
      casts_per_rank: 5
      max_rank: 5
      charge_bonus_per_rank: 1
      power_per_rank: 0.1
  - id: cryo_lock
    name: Cryo-Lock
    description: Flash-freezes a foe, locking it in place for a few moments.
    target: enemy
    radius: 0
    effects:
      - type: damage
        power: 8
      - type: stun
        duration: 150
    recipes:
      - ingredients: [ice_shard, earth_stone]
        charges: 3
    mastery:
      casts_per_rank: 5
      max_rank: 5
      charge_bonus_per_rank: 1
      power_per_rank: 0.1
  - id: aegis
    name: Aegis
    description: Wraps you in a ward that blunts incoming blows.
    target: self
    radius: 0
    effects:
      - type: shield
        power: 5
        duration: 150
    recipes:
      - ingredients: [earth_stone, mystic_herb]
        charges: 3
    mastery:
      casts_per_rank: 5
      max_rank: 5
      charge_bonus_per_rank: 1
      power_per_rank: 0.15
  - id: siphon
    name: Siphon
    description: Leeches an enemy's vitality, healing you for part of the harm.
    target: enemy
    radius: 0
    effects:
      - type: drain
        power: 14
        lifesteal: 7
    recipes:
      - ingredients: [storm_shard, mystic_herb]
        charges: 3
    mastery:
      casts_per_rank: 5
      max_rank: 5
      charge_bonus_per_rank: 1
      power_per_rank: 0.12
  - id: douse
    name: Douse
    description: A bracing splash that leaves the target soaked.
    target: enemy
    radius: 1
    effects:
      - type: damage
        power: 5
      - type: wet
        duration: 80
    recipes:
      - ingredients: [gale_feather, ice_shard]
        charges: 4
    mastery:
      casts_per_rank: 5
      max_rank: 5
      charge_bonus_per_rank: 1
      power_per_rank: 0.1
  - id: lightning_bolt
    name: Lightning Bolt
    description: A searing bolt that overloads soaked foes.
    target: enemy
    radius: 0
    effects:
      - type: damage
        power: 14
    modifiers:
      - vs_status: wet
        damage_mult: 2.0
    recipes:
      - ingredients: [storm_shard, storm_shard]
        charges: 4
    momentum_damage_per_stack: 0.1
    mastery:
      casts_per_rank: 5
      max_rank: 5
      charge_bonus_per_rank: 1
      power_per_rank: 0.12
  # Rare (shop-learned): a utility buy that lights up every hidden trap on the floor. Rare spells
  # are hidden from crafting discovery, so a shop purchase is how you learn the recipe.
  - id: clairvoyance
    name: Clairvoyance
    description: Reveals every hidden trap on the floor.
    target: self
    rare: true
    radius: 0
    effects:
      - type: reveal
    recipes:
      - ingredients: [earth_stone, gale_feather]
        charges: 2
    shop:
      price: 40
      charges: 2
