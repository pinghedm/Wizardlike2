# Sound effects, one entry per SoundId. Each is either a synthesized blip or a WAV file.
#
# Synth fields:
#   waveform  one of: sine | square | triangle | saw | noise
#   freq      base frequency in Hz (ignored for noise; use 0)
#   duration  length in seconds
#   freq_end  optional target frequency for a pitch sweep over the duration
#   decay     exponential envelope rate (higher = snappier)
#   volume    0..1, the sound's own loudness before the SFX volume setting
#
# To use a recording instead of synthesis, give a `file:` (path relative to the data dir)
# in place of the synth fields.

sounds:
  cast_attack:
    waveform: square
    freq: 220
    freq_end: 660
    duration: 0.18
    decay: 8
    volume: 0.45
